kind = "web"
previewPath = "/"
title = "Reference App"
version = "1.0.0"
id = "artifacts/reference-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 26256
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/reference-app run dev"

[services.env]
PORT = "26256"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/reference-app", "run", "build"]
publicDir = "artifacts/reference-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
